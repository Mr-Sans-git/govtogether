<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>GovTogether</title>
<style>
  /* Not make the site look like crap */
  body {
    font-family: -apple-system, Segoe UI, Arial, sans-serif;
    max-width: 600px;
    margin: 40px auto;
    padding: 0 20px;
    background: #f6f6f4;
    color: #222;
  }

  h2, h3 { margin-top: 0; }

  input, textarea {
    display: block;
    width: 100%;
    margin: 6px 0 12px;
    padding: 8px;
    border: 1px solid #ccc;
    border-radius: 4px;
    font-family: inherit;
    font-size: 1rem;
    box-sizing: border-box;
  }

  button {
    padding: 8px 16px;
    border: none;
    border-radius: 4px;
    background: #2c6e49;
    color: #fff;
    cursor: pointer;
    font-size: 0.95rem;
  }
  button:hover { background: #234f36; }

  #login {
    max-width: 320px;
    margin: 80px auto;
    background: #fff;
    padding: 24px;
    border-radius: 8px;
    border: 1px solid #ddd;
  }

  #home { display: none; }

  .post {
    background: #fff;
    border: 1px solid #ddd;
    border-radius: 8px;
    padding: 16px;
    margin-bottom: 16px;
  }
  .post img { max-width: 100%; border-radius: 4px; }

  .comments p {
    background: #f0efe9;
    padding: 6px 10px;
    border-radius: 4px;
    margin: 6px 0;
    font-size: 0.9rem;
  }

  #loginError { color: #b3261e; }
</style>
</head>
<body>

<!-- whats my password again? -->
<div id="login">
  <h2>Log in</h2>
  <input type="text" id="username" placeholder="Email">
  <input type="password" id="password" placeholder="Password">
  <button onclick="tryLogin()">Log in</button>
  <p id="loginError" style="color:red;"></p>
</div>

<!-- i now know what my password is -->
<div id="home">
  <h2>GovTogether</h2>

  <!-- post to not twitter.com -->
  <h3>New post</h3>
  <input type="text" id="postImage" placeholder="Image URL">
  <input type="text" id="postPdf" placeholder="PDF URL">
  <textarea id="postDesc" placeholder="Description"></textarea>
  <textarea id="postWhy" placeholder="Why did you upload this?"></textarea>
  <button onclick="addPost()">Post</button>

  <h3>Feed</h3>
  <div id="feed">Loading...</div>
</div>

<!-- Firebase i need this) -->
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>

<script>
  /* top 10 api key momemts */
  const firebaseConfig = {
    apiKey: "AIzaSyAJEqvJvlvjQolMGwXfuRaB5i8M-LVNqnU",
    authDomain: "vsvsac-santiago.firebaseapp.com",
    projectId: "vsvsac-santiago",
    storageBucket: "vsvsac-santiago.firebasestorage.app",
    messagingSenderId: "171130145745",
    appId: "1:171130145745:web:f400fa72377211adcc2ef0"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();
  const auth = firebase.auth();

  /* auth stuff */
  let currentUserName = "Anonymous";
  function tryLogin() {
    const email = document.getElementById("username").value.trim();
    const pass = document.getElementById("password").value.trim();

    auth.signInWithEmailAndPassword(email, pass)
      .then(function () {
        return db.collection("names").doc(email).get();
      })
      .then(function (doc) {
        currentUserName = doc.exists ? doc.data().name : "Anonymous";
        document.getElementById("login").style.display = "none";
        document.getElementById("home").style.display = "block";
        loadFeed();
      })
      .catch(function (error) {
        /* what would i ever do without error messages istg these are amazing */
        document.getElementById("loginError").innerText = "Error: " + error.code + " - " + error.message;
      });
  }

  /* annnnd, upload! */
  function addPost() {
    const image = document.getElementById("postImage").value;
    const pdf = document.getElementById("postPdf").value;
    const desc = document.getElementById("postDesc").value;
    const why = document.getElementById("postWhy").value;

    if (!image || !desc || !pdf) {
      alert("Please add an image url, a PDF url, and a description.");
      return;
    }

    db.collection("posts").add({
      name: currentUserName,
      image: image,
      pdf: pdf,
      desc: desc,
      why: why,
      time: firebase.firestore.FieldValue.serverTimestamp()
    });
    
    document.getElementById("postImage").value = "";
    document.getElementById("postPdf").value = "";
    document.getElementById("postDesc").value = "";
    document.getElementById("postWhy").value = "";
  }

  /* add a comment to a specific post's comments array */
  function addComment(postId) {
    const text = document.getElementById("ctext_" + postId).value;

    if (!text) return;

    db.collection("posts").doc(postId).update({
      comments: firebase.firestore.FieldValue.arrayUnion({ name: currentUserName, text: text })
    });
  }

  /* woah it updates */
  function loadFeed() {
    db.collection("posts").orderBy("time", "desc").onSnapshot(function (snapshot) {
      const feed = document.getElementById("feed");
      feed.innerHTML = "";

      if (snapshot.empty) {
        feed.innerHTML = "No posts yet :(";
        return;
      }

      snapshot.forEach(function (doc) {
        const post = doc.data();

        let html = "<div class='post'>";
        html += "<b>" + post.name + "</b><br>";
        html += "<img src='" + post.image + "'><br>";
        html += post.desc + "<br>";
        if (post.why) html += "<i>Why: " + post.why + "</i><br>";
        if (post.pdf) {
          html += "<a href='" + post.pdf + "' download target='_blank' rel='noopener'>Download PDF</a>";
          html += " &nbsp; <a href='" + post.pdf + "' target='_blank' rel='noopener'>" + post.pdf + "</a><br>";
        }

        /* the world needs order to discuss life saving pdfs */
        html += "<div class='comments'>";
        if (post.comments) {
          post.comments.forEach(function (c) {
            html += "<p><b>" + c.name + "</b> commented: " + c.text + "</p>";
          });
        }
        html += "</div>";

        /* im very glad i took that web publishing class but anyways this is self explanatory */
        html += "<input type='text' id='ctext_" + doc.id + "' placeholder='Add a comment'>";
        html += "<button onclick=\"addComment('" + doc.id + "')\">Comment</button>";
        html += "</div>";

        feed.innerHTML += html;
      });
    });
  }
</script>

</body>
</html>
